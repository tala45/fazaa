<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style><title>Fazaa فزعة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Fazaa design plan
   Layout: public pages are a navy hero band over a light page; the signed-in app is a sidebar (desktop) or bottom tabs (phone) with calm card sections.
   Color: deep navy (primary), lavender (accent), blue-tinted neutrals; green, amber and red are used only for status.
   Type: Readex Pro for headings and numbers, IBM Plex Sans Arabic for text. Both carry Arabic and Latin, so the two languages share one voice. */
:root{
  --navy:#1b2160; --navy-2:#2a3290; --lav:#bdb4f6;
  --bg:#f5f5fb; --surface:#ffffff; --surface-2:#eff0f9; --fg:#151a40; --muted:#5a5f86; --line:#e0e2f0;
  --primary:#1b2160; --on-primary:#ffffff; --primary-hover:#262e82;
  --accent:#7c6df0; --accent-soft:#ebe8fd; --accent-ink:#4a3fc0;
  --hero-bg:#1b2160; --hero-fg:#ffffff; --hero-muted:#c5c8ee;
  --good:#1c7c54; --good-soft:#e0f4ea; --warn:#9a5f00; --warn-soft:#fcf0d9; --bad:#b83226; --bad-soft:#fbe5e2;
  --shadow:0 1px 2px rgba(21,26,64,.06),0 10px 28px rgba(21,26,64,.07);
  --ring:0 0 0 3px rgba(124,109,240,.35);
  --r:18px; --r-sm:12px;
  --font-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1030; --surface:#151a45; --surface-2:#1c2257; --fg:#eceeff; --muted:#a4a9d4; --line:#2a3068;
  --primary:#9f93f7; --on-primary:#0d1030; --primary-hover:#b3a9fa;
  --accent:#9f93f7; --accent-soft:#2a2766; --accent-ink:#cfc9ff;
  --hero-bg:#171c55; --hero-fg:#ffffff; --hero-muted:#b9bde8;
  --good:#52c995; --good-soft:#143a2d; --warn:#f0b64d; --warn-soft:#3b2d10; --bad:#ff8d80; --bad-soft:#42201d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1030; --surface:#151a45; --surface-2:#1c2257; --fg:#eceeff; --muted:#a4a9d4; --line:#2a3068;
  --primary:#9f93f7; --on-primary:#0d1030; --primary-hover:#b3a9fa;
  --accent:#9f93f7; --accent-soft:#2a2766; --accent-ink:#cfc9ff;
  --hero-bg:#171c55; --hero-fg:#ffffff; --hero-muted:#b9bde8;
  --good:#52c995; --good-soft:#143a2d; --warn:#f0b64d; --warn-soft:#3b2d10; --bad:#ff8d80; --bad-soft:#42201d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.65;min-height:100%}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
[dir=rtl] *{letter-spacing:0!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin-inline:auto;width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px} .stack-s{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.ic{flex:none;display:inline-block;vertical-align:middle}
[dir=rtl] .flip{transform:scaleX(-1)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;font-weight:600;font-size:15px;text-decoration:none!important;background:var(--surface-2);color:var(--fg);transition:background .15s,transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--on-primary)} .btn.primary:hover{background:var(--primary-hover)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)} .btn.soft:hover{filter:brightness(.97)}
.btn.line{background:transparent;border-color:var(--line)} .btn.line:hover{background:var(--surface-2)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.lg{min-height:52px;padding:0 28px;font-size:16px}
.btn.on-dark{background:#fff;color:#1b2160} .btn.on-dark:hover{background:#ecebff}
.btn.ghost-dark{background:transparent;color:var(--hero-fg);border-color:rgba(255,255,255,.35)} .btn.ghost-dark:hover{background:rgba(255,255,255,.1)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--muted)} .iconbtn:hover{background:var(--surface-2)}

/* cards & bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tint{background:var(--accent-soft);border-color:transparent;box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.pill.sim{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tag{display:inline-block;padding:1px 9px;border-radius:8px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.av{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;font-family:var(--font-display);font-weight:600;font-size:16px;background:var(--accent-soft);color:var(--accent-ink)}
.av.av1{background:var(--surface-2);color:var(--fg)} .av.av2{background:var(--primary);color:var(--on-primary)}
.av.lg{width:72px;height:72px;font-size:26px} .av.sm{width:34px;height:34px;font-size:13px}
.stars{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.stars .ic{color:#e3a21a}
.divider{height:1px;background:var(--line);border:0;margin:0}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--fg);border:1px solid transparent}
.banner .ic{color:var(--warn);margin-top:3px}
.banner.info{background:var(--accent-soft)} .banner.info .ic{color:var(--accent-ink)}
.banner.bad{background:var(--bad-soft)} .banner.bad .ic{color:var(--bad)}
.banner.good{background:var(--good-soft)} .banner.good .ic{color:var(--good)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .ic{color:var(--accent);margin-bottom:8px}
.empty h3{color:var(--fg);margin-bottom:6px;font-size:17px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.boot{min-height:60vh;display:grid;place-items:center}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:600;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--bad)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],input[type=datetime-local],select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);transition:border-color .15s}
textarea{min-height:120px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--bad)}
.pw{position:relative}
.pw input{padding-inline-end:48px}
.pw .iconbtn{position:absolute;inset-inline-end:4px;top:3px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:36px;padding:0 16px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);cursor:pointer;font-weight:500}
.radios input{width:auto;min-height:0;accent-color:var(--accent)}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;min-height:0;margin-top:3px;accent-color:var(--accent);flex:none}

/* public header / landing */
.pubhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero-bg);color:var(--hero-fg)}
.pubhead .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.pubhead.light{background:var(--bg);color:var(--fg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero-bg)}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px;color:inherit;text-decoration:none!important}
.logo .mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--lav);color:#1b2160;font-size:24px;line-height:1;padding-bottom:4px}
.hero{background:var(--hero-bg);color:var(--hero-fg);padding-block:clamp(32px,6vw,72px) clamp(40px,7vw,88px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,5vw,64px);align-items:center}
.hero h1{font-size:clamp(2.6rem,8vw,5rem);line-height:1.15;font-weight:700}
.hero .en{font-family:var(--font-display);font-size:clamp(1.1rem,2.6vw,1.5rem);color:var(--lav);font-weight:500;margin-top:10px}
.hero p.lead{color:var(--hero-muted);font-size:clamp(1rem,2vw,1.15rem);max-width:34em;margin-top:18px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .note{margin-top:16px;color:var(--hero-muted);font-size:13px}
.demo-card{background:var(--surface);color:var(--fg);border-radius:22px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.sect{padding-block:clamp(40px,6vw,76px)}
.sect h2{font-size:clamp(1.5rem,3.6vw,2.2rem);margin-bottom:10px}
.sect .sub{color:var(--muted);max-width:40em}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.step .n{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--accent-ink);background:var(--accent-soft);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-bottom:14px}
.step h3{font-size:18px;margin-bottom:6px}
.why{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 36px;margin-top:28px}
.why .item{display:flex;gap:14px}
.why .item .ic{color:var(--accent-ink);background:var(--accent-soft);padding:10px;border-radius:12px;width:44px;height:44px;flex:none}
.why h3{font-size:17px;margin-bottom:4px}
.unis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
.cta-band{background:var(--hero-bg);color:var(--hero-fg);border-radius:28px;padding:clamp(28px,5vw,52px);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.footer{padding-block:32px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}

/* auth */
.authwrap{max-width:560px;margin-inline:auto;padding-block:28px 56px}
.authwrap h1{font-size:clamp(1.6rem,4vw,2rem);margin-bottom:6px}
.codebox{font-family:var(--font-display);font-size:34px;letter-spacing:.3em!important;font-weight:700;text-align:center;padding:14px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent-ink);direction:ltr}

/* app shell */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;max-width:1280px;margin-inline:auto;padding-block:20px 40px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:18px;height:calc(100vh - 40px - env(safe-area-inset-top,0px));overflow:auto}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;color:var(--muted);font-weight:500;text-decoration:none}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .count{margin-inline-start:auto}
.userbox{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.topbar{display:none}
.bottom{display:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead h1{font-size:clamp(1.5rem,3.4vw,2rem)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stat{padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--font-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list>.li:first-child{border-top:0;padding-top:0}
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.hcard{display:flex;flex-direction:column;gap:12px}
.hcard .top{display:flex;gap:12px;align-items:center}
.hcard .bio{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:14px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta span{display:inline-flex;gap:5px;align-items:center}
.price{font-family:var(--font-display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;gap:8px;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:transparent;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--primary);color:var(--on-primary)}
.tab .n{font-size:12px;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:0 8px;min-width:22px;text-align:center}
.tab.on .n{background:rgba(255,255,255,.2);color:inherit}
.match{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px}
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;background:var(--accent-soft);color:var(--accent-ink);padding:10px 4px;height:fit-content}
.score b{font-family:var(--font-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.score span{font-size:11px;font-weight:600}
.reasons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14px}
.reasons li{display:flex;gap:8px;align-items:flex-start}
.reasons .ic{color:var(--good);margin-top:4px}
.reasons li.cv .ic{color:var(--warn)}
details.bd summary{cursor:pointer;font-size:13px;color:var(--accent-ink);font-weight:600;list-style:none;padding:4px 0}
details.bd summary::-webkit-details-marker{display:none}
.bars{display:grid;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar i{display:block;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--accent);border-radius:6px}
.chat{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;padding:4px}
.msg{max-width:82%;padding:8px 12px;border-radius:16px;background:var(--surface-2);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:var(--accent-soft);color:var(--accent-ink)}
.msg small{display:block;opacity:.65;font-size:11px;margin-top:2px}
.rate{display:flex;gap:4px;direction:ltr}
.rate button{border:0;background:transparent;padding:4px;color:var(--line)}
.rate button.on{color:#e3a21a}
.hist{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.delta{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;min-width:56px;text-align:end}
.delta.pos{color:var(--good)} .delta.neg{color:var(--bad)}
.rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.balance{background:var(--hero-bg);color:var(--hero-fg);border-radius:var(--r);padding:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.balance b{font-family:var(--font-display);font-size:clamp(2.4rem,7vw,3.4rem);line-height:1;font-variant-numeric:tabular-nums}
.sticky-note{font-size:12px;color:var(--muted)}
.daygrid{display:flex;gap:6px;flex-wrap:wrap}

/* toast & modal */
.toasts{position:fixed;inset-inline:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.toast{pointer-events:auto;max-width:min(440px,100%);padding:12px 16px;border-radius:14px;background:var(--fg);color:var(--bg);box-shadow:var(--shadow);font-weight:500;display:flex;gap:10px;align-items:center;animation:rise .2s ease-out}
.toast.bad{background:var(--bad);color:#fff} .toast.good{background:var(--good);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,40,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0}

function validateUniEmail(uniId, email) {
  const e = String(email || '').trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) return { ok: false, code: 'email_invalid' };
  const uni = UNI(uniId);

  if (uni.domains.includes(dom)) return { ok: true, email: e };
  const other = UNIVERSITIES.find(u => u.domains.includes(dom));

  setHelperActive(on) { const v = need(); const h = helperOf(v.id); if (!h) throw E('no_helper_profile'); h.active = !!on; commit(); return me(); },

  listHelpers(f) {
    const v = need(); f = f || {}; const q = norm(cleanStr(f.q, 60)); const today = new Date().getDay(); const nowM = new Date().getHours() * 60 + new Date().getMinutes();
    const list = eligibleHelpers(v).filter(h => {
      if (f.cat && f.cat !== 'all' && !h.subjects.includes(f.cat)) return false;

          h.subjects.map(c => (CAT(c) || {}).en + ' ' + (CAT(c) || {}).ar).join(' '), h.topics.map(t => (TOPIC(t) || {}).en + ' ' + (TOPIC(t) || {}).ar).join(' '),
          (MAJOR(p.majorId) || {}).en, (MAJOR(p.majorId) || {}).ar].join(' '));
        if (!q.split(' ').every(w => hay.includes(w))) return false;

    return list.sort((a, b) => (b.featured - a.featured) || (b.rating - a.rating) || (b.completed - a.completed));
  },
  getHelper(id) {
    const v = need(); const u = guardUser(v, id); const h = helperOf(u.id); if (!h || (!h.active && u.id !== v.id)) throw E('not_found');
    const reviews = DB.reviews.filter(r => r.helperId === id && r.community === v.community).sort((a, b) => b.createdAt - a.createdAt).slice(0, 20).map(r => {
      const ru = userOf(r.requesterId); return { rating: r.rating, text: r.text, at: r.createdAt, by: publicUser(ru).names };
    });
    return { helper: publicHelper(h), reviews, isSelf: u.id === v.id };
  },
  recommend() {
    const v = need(); const p = profileOf(v.id); const my = new Set([...(p.interests || []), ...((MAJOR(p.majorId) || {}).cats || [])]);
    return eligibleHelpers(v).map(h => ({ h, s: (h.subjects.filter(x => my.has(x)).length ? 0.6 : 0) + 0.4 * reputationScore(h.userId) }))
      .filter(x => x.s >= 0.6).sort((a, b) => b.s - a.s).slice(0, 3).map(x => publicHelper(x.h));
  },

  analyzeRequest(d) {
    const v = need(); d = d || {}; const text = cleanText(d.text, 1500); if (text.length < 12) throw E('text_short');
    const mod = moderate([text, d.extra || ''].join(' '));
    let out = null, engine = 'demo';
    if (typeof CONFIG.llmAnalyze === 'function') { try { out = validateExtraction(CONFIG.llmAnalyze(text)); engine = 'llm'; } catch (e) { out = null; } }

  },
  createRequest(d) {

    const mode = ['online', 'inperson', 'either'].includes(d.mode) ? d.mode : 'either';
    let preferredAt = null;

    if (budgetType === 'free') budgetMax = 0;
    const extra = cleanText(d.extra, 500);
    const mod = moderate([text, ex.topic, extra].join(' '));
    const req = { id: uid('rq'), requesterId: v.id, community: v.community, text, subject: ex.subject, topic: ex.topic, topicId: ex.topicId, assistance: ex.assistance, urgency: ex.urgency,
      skills: ex.skills, keywords: ex.keywords, mode, preferredAt, budgetType, budgetMax, extra, status: mod.flagged ? 'under_review' : 'open', flags: mod.reasons, createdAt: now(), updatedAt: now() };
    DB.requests.push(req);
    let session = null;
    if (!mod.flagged && d.targetHelperId) {
      guardUser(v, d.targetHelperId); if (d.targetHelperId === v.id) throw E('forbidden');
      try { session = createSessionInternal(req, d.targetHelperId, 'requester'); } catch (e) { DB.requests.splice(DB.requests.indexOf(req), 1); throw e; }

  },
  getMatches(requestId, opts) {
    const v = need(); const r = guardRequestOwner(v, requestId); if (r.status !== 'open') throw E('request_not_open');
    return { request: publicRequest(r, v), matches: rankHelpers(v, r, { relax: !!(opts && opts.broaden) }) };
  },
  myRequests() { const v = need(); return DB.requests.filter(r => r.requesterId === v.id && r.community === v.community && !r.demoPast).filter(r => !(r.status === 'closed' && /^Past demo/.test(r.text))).sort((a, b) => b.createdAt - a.createdAt).map(r => publicRequest(r, v)); },
  cancelRequest(id) {
    const v = need(); const r = guardRequestOwner(v, id); if (!['open', 'under_review', 'matched'].includes(r.status)) throw E('bad_state');

    r.status = 'cancelled'; r.updatedAt = now(); commit(); return true;
  },
  board() {
    const v = need(); const h = helperOf(v.id); if (!h || !h.active) throw E('no_helper_profile');
    return DB.requests.filter(r => r.status === 'open' && r.community === v.community && r.requesterId !== v.id).sort((a, b) => b.createdAt - a.createdAt).map(r => ({
      ...publicRequest(r, v), requester: publicUser(userOf(r.requesterId)), offered: DB.sessions.some(s => s.requestId === r.id && s.helperId === v.id && ACTIVE.includes(s.status)), matchesMe: h.subjects.includes(r.subject) }))

  offerHelp(requestId) {
    const v = need(); const h = helperOf(v.id); if (!h || !h.active) throw E('no_helper_profile');

  createSession(d) {

  listSessions() { const v = need(); return DB.sessions.filter(s => s.community === v.community && (s.requesterId === v.id || s.helperId === v.id)).sort((a, b) => b.updatedAt - a.updatedAt).map(s => publicSession(s, v)); },
  respondSession(id, accept) {

  },
  startSession(id) { const v = need(); const s = guardSession(v, id); if (s.helperId !== v.id || s.status !== 'accepted') throw E('bad_state'); pushHistory(s, 'in_progress', v.id); commit(); return publicSession(s, v); },
  completeSession(id) {
    const v = need(); const s = guardSession(v, id); if (s.helperId !== v.id || s.status !== 'in_progress') throw E('bad_state');

  cancelSession(id) { const v = need(); const s = guardSession(v, id); if (!['pending', 'accepted'].includes(s.status)) throw E('bad_state'); cancelInternal(s, v.id); commit(); return publicSession(s, v); },

  messages(sessionId) {
    const v = need(); const s = guardSession(v, sessionId);

  },
  sendMessage(sessionId, text) {

  createReview(sessionId, rating, text) {

  points() {
    const v = need();
    const entries = DB.points.filter(p => p.userId === v.id).sort((a, b) => b.at - a.at).map(p => ({ id: p.id, delta: p.delta, reason: p.reason, at: p.at }));

  redeem(rewardId) {

  report(d) {

async function init() {

    ${info.demoCode ? `<div class="card tint stack-s"><p class="small" style="font-weight:600">${ic('monitor', 16)} ${t('verify_demo')}</p><div class="codebox" aria-label="${t('verify_code')}">${esc(info.demoCode)}</div><p class="small muted">${t('verify_demo_d')}</p></div>` : ''}
    <form id="f-verify" data-form="verify" class="card stack" novalidate><div id="verify-err" role="alert"></div>
      <div class="field"><label for="v-code">${t('verify_code')}</label><input id="v-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr" data-f="verify.code" value="${esc(fget('verify', 'code'))}"></div>
      <button class="btn primary lg" type="submit">${t('verify_btn')}</button>
      <div class="row between"><button type="button" class="btn sm line" data-act="resend">${ic('refresh', 16)}${t('resend')}</button><a href="#dashboard" class="small">${t('verify_later')}</a></div></form>
    <div class="banner info">${ic('alert', 18)}<span>${t('verify_scope')}</span></div></div></div></div>`;
}

</script>
<script>
/* Fazaa UI, part 2: signed-in shell and pages */
function shell(route, inner) {
  const u = S.user; let incoming = 0;
  try { incoming = api.listSessions().filter(s => s.canRespond).length; } catch (e) { /* ignore */ }
  const items = [['dashboard', 'home', 'nav_dashboard'], ['explore', 'search', 'nav_explore'], ['request', 'plus', 'nav_request'], ['sessions', 'calendar', 'nav_sessions'], ['rewards', 'gift', 'nav_rewards'], ['profile', 'user', 'nav_profile']];
  if (u.isModerator) items.push(['moderation', 'shield', 'nav_moderation']);
  items.push(['guidelines', 'book', 'guidelines']);
  const other = S.lang === 'ar' ? 'English' : 'العربية';
  const nav = items.map(([r, i, k]) => `<a href="#${r}" class="${route === r ? 'on' : ''}" ${route === r ? 'aria-current="page"' : ''}>${ic(i, 20)}<span>${t(k)}</span>${r === 'sessions' && incoming ? `<span class="pill accent count">${incoming}</span>` : ''}</a>`).join('');
  const bottom = items.slice(0, 5).map(([r, i, k]) => `<a href="#${r}" class="${route === r ? 'on' : ''} ${r === 'request' ? 'plus' : ''}" ${route === r ? 'aria-current="page"' : ''}>${ic(i, 22)}<span>${t(k)}</span></a>`).join('');
  const verifyBanner = u.verified ? '' : `<div class="banner">${ic('alert', 20)}<div class="grow"><b>${t('unverified_t')}</b><p class="small">${t('unverified_d')}</p></div><a class="btn sm soft" href="#verify">${t('verify_btn')}</a></div>`;
  return `<div class="app gut">
    <aside class="side">${logo('#dashboard')}<nav class="nav" aria-label="${t('menu')}">${nav}</nav>
      <div class="userbox"><div class="row" style="flex-wrap:nowrap">${avatar(u)}<div class="grow"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis">${esc(nm(u))}</div><div class="tiny muted">${esc(uniShort(u.universityId))}</div></div></div>
        ${modeSwitch()}
        <div class="row"><button class="btn sm line" data-act="lang">${ic('globe', 16)}${other}</button><button class="btn sm line" data-act="logout">${ic('logout', 16)}${t('logout')}</button></div></div></aside>
    <main class="main" id="main"><div class="topbar">${logo('#dashboard')}<div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn sm line" data-act="lang" aria-label="${t('language')}">${ic('globe', 16)}${other}</button><a href="#profile" aria-label="${t('nav_profile')}">${avatar(u, 'sm')}</a></div></div>
      ${verifyBanner}${inner}</main>
    <nav class="bottom" aria-label="${t('menu')}">${bottom}</nav></div>`;
}
const modeSwitch = () => `<div class="seg" role="group" aria-label="${t('mode')}"><button data-act="mode" data-v="learn" class="${S.mode === 'learn' ? 'on' : ''}" aria-pressed="${S.mode === 'learn'}">${t('mode_learn')}</button><button data-act="mode" data-v="help" class="${S.mode === 'help' ? 'on' : ''}" aria-pressed="${S.mode === 'help'}">${t('mode_help')}</button></div>`;
const pageHead = (title, sub, right) => `<div class="pagehead"><div><h1>${title}</h1>${sub ? `<p class="muted">${sub}</p>` : ''}</div>${right || ''}</div>`;

function sessionMini(s) {
  return `<a class="li" href="#sessions" style="color:inherit;text-decoration:none" data-act="opensession" data-id="${s.id}">${avatar(s.counterpart, 'sm')}<div class="grow"><div style="font-weight:600">${esc(firstName(s.counterpart))} · ${esc(catName(s.request.subject))}</div>
    <div class="small muted">${s.scheduledAt ? fmtDT(s.scheduledAt) : t('time_tbd')} · ${t(s.mode === 'online' ? 'online' : 'inperson')}</div></div>${statusPill(s.status)}</a>`;
}
function activityText(a) {
  if (a.type === 'session') return t('act_' + a.status, { name: firstName({ names: a.who }) });
  if (a.type === 'points') return t('act_points', { n: (a.delta > 0 ? '+' : '') + a.delta, reason: t(a.reason.startsWith('redeem:') ? 'pr_redeem' : 'pr_' + a.reason) });
  if (a.type === 'review') return t('act_review', { n: a.rating });
  return t('act_request', { subject: catName(a.subject) });
}
const actIcon = a => ({ session: 'calendar', points: 'award', review: 'star', request: 'plus' }[a.type]);

function viewDashboard() {
  const d = api.dashboard(); const u = S.user; const help = S.mode === 'help'; const hasHelper = !!u.helper;
  const upcoming = d.upcoming.length ? `<div class="list">${d.upcoming.slice(0, 4).map(sessionMini).join('')}</div>` : empty('calendar', t('no_upcoming'), t('no_upcoming_d'));
  const incoming = d.incoming.length ? `<div class="list">${d.incoming.map(s => `<div class="li">${avatar(s.counterpart, 'sm')}<div class="grow"><div style="font-weight:600">${esc(firstName(s.counterpart))} · ${esc(catName(s.request.subject))}</div><div class="small muted">${esc(s.request.topic || '')}</div></div><a class="btn sm primary" href="#sessions" data-act="opensession" data-id="${s.id}">${t('review_request')}</a></div>`).join('')}</div>` : empty('inbox', t('no_incoming'), hasHelper ? t('no_incoming_d') : t('no_helper_d'), hasHelper ? '' : `<button class="btn primary sm" data-act="gohelper">${t('create_helper')}</button>`);
  const recs = d.recommended.length ? `<div class="list">${d.recommended.map(h => `<div class="li">${avatar(h, 'sm')}<div class="grow"><a href="#helper-${h.id}" style="font-weight:600;color:var(--fg)">${esc(nm(h))}</a><div class="small muted">${esc(h.subjects.slice(0, 2).map(catName).join(' · '))}</div></div>${rating(h)}${priceHtml(h)}</div>`).join('')}</div>` : empty('users', t('no_recs'), t('no_recs_d'));
  const act = d.activity.length ? `<div class="list">${d.activity.map(a => `<div class="li">${ic(actIcon(a), 18)}<div class="grow small">${activityText(a)}</div><span class="tiny muted">${ago(a.at)}</span></div>`).join('')}</div>` : empty('clock', t('no_activity'), '');
  const main = help
    ? `<div class="card"><div class="row between" style="margin-bottom:10px"><h3>${t('incoming_title')}</h3></div>${incoming}</div><div class="card"><h3 style="margin-bottom:10px">${t('upcoming_title')}</h3>${upcoming}</div>`
    : `<div class="card"><h3 style="margin-bottom:10px">${t('upcoming_title')}</h3>${upcoming}</div><div class="card"><div class="row between" style="margin-bottom:10px"><h3>${t('recs_title')}</h3><a class="small" href="#explore">${t('see_all')}</a></div>${recs}</div>`;
  return shell('dashboard', `${pageHead(t('welcome', { name: firstName(u) }), t(help ? 'welcome_help' : 'welcome_learn'), `<div class="mode-m">${modeSwitch()}</div>`)}
    <div class="row">${help
      ? `<a class="btn primary lg" href="#explore" data-act="goboard">${ic('inbox', 20)}${t('see_board')}</a><button class="btn lg line" data-act="gohelper">${ic('user', 20)}${t(hasHelper ? 'edit_helper' : 'offer_help')}</button>`
      : `<a class="btn primary lg" href="#request">${ic('plus', 20)}${t('request_help')}</a><button class="btn lg line" data-act="gohelper">${ic('award', 20)}${t('offer_help')}</button>`}</div>
    <div class="stats"><div class="stat"><b>${u.points}</b><span>${t('points')}</span></div><div class="stat"><b>${help ? d.incoming.length : d.activeRequests.length}</b><span>${t(help ? 'stat_incoming' : 'stat_active')}</span></div><div class="stat"><b>${d.upcoming.length}</b><span>${t('stat_upcoming')}</span></div></div>
    <div class="two"><div class="stack">${main}</div><div class="stack"><div class="card"><h3 style="margin-bottom:10px">${t('activity_title')}</h3>${act}</div>
      ${d.waiting.length ? `<div class="card"><h3 style="margin-bottom:10px">${t('waiting_title')}</h3><div class="list">${d.waiting.map(sessionMini).join('')}</div></div>` : ''}</div></div>`);
}

/* explore */
function helperCard(h) {
  return `<article class="card hcard"><div class="top">${avatar(h)}<div class="grow"><div class="row" style="gap:6px"><a href="#helper-${h.id}" style="font-weight:600;color:var(--fg)">${esc(nm(h))}</a>${h.featured ? pill(ic('zap', 12) + t('featured'), 'accent') : ''}</div><div class="small muted">${esc(uniName(h.universityId))}</div></div>${priceHtml(h)}</div>
    <div class="chips">${h.subjects.slice(0, 3).map(s => `<span class="tag">${esc(catName(s))}</span>`).join('')}</div>
    <p class="bio">${esc(L(h.bio))}</p>
    <div class="meta"><span>${rating(h)}</span><span>${ic('check', 14)}${t('sessions_done', { n: h.completed })}</span></div>
    <div class="meta"><span>${ic('clock', 14)}${availText(h)}</span></div>
    <div class="row"><a class="btn line sm" href="#helper-${h.id}">${t('view_profile')}</a><button class="btn primary sm" data-act="reqhelper" data-id="${h.id}">${t('request_help')}</button></div></article>`;
}
function exResults() {
  const list = api.listHelpers({ q: S.ex.q, cat: S.ex.cat, avail: S.ex.avail, free: S.ex.free });
  if (!list.length) return empty('search', t('no_helpers'), t('no_helpers_d'), `<button class="btn soft sm" data-act="exreset">${t('clear_filters')}</button>`);
  return `<p class="small muted" style="margin-bottom:10px">${t('n_helpers', { n: list.length })}</p><div class="hcards">${list.map(helperCard).join('')}</div>`;
}
function boardHtml() {
  let list = []; try { list = api.board(); } catch (e) { return empty('inbox', t('no_helper_profile'), t('no_helper_d'), `<button class="btn primary sm" data-act="gohelper">${t('create_helper')}</button>`); }
  if (!list.length) return empty('inbox', t('no_board'), t('no_board_d'));
  return `<p class="small muted" style="margin-bottom:10px">${t('board_note')}</p><div class="hcards">${list.map(r => `<article class="card hcard"><div class="top">${avatar(r.requester, 'sm')}<div class="grow"><b>${esc(firstName(r.requester))}</b><div class="small muted">${esc(catName(r.subject))}${r.topic ? ' · ' + esc(r.topic) : ''}</div></div>${r.matchesMe ? pill(t('fits_you'), 'good') : ''}</div>
    <p class="bio">${esc(r.text)}</p><div class="chips">${pill(t('urg_' + r.urgency), r.urgency === 'high' ? 'warn' : '')}${pill(t('as_' + r.assistance))}${pill(t(r.mode === 'either' ? 'either' : r.mode === 'online' ? 'online' : 'inperson'))}</div>
    <div class="meta"><span>${ic('calendar', 14)}${r.preferredAt ? fmtDT(r.preferredAt) : t('time_flex')}</span><span>${budgetText(r)}</span></div>
    <div class="row">${r.offered ? pill(ic('check', 12) + t('offer_sent'), 'good') : `<button class="btn primary sm" data-act="offer" data-id="${r.id}">${t('offer_to_help')}</button>`}<button class="btn line sm" data-act="report" data-type="request" data-id="${r.id}">${ic('flag', 14)}${t('report')}</button></div></article>`).join('')}</div>`;
}
const budgetText = r => (r.budgetType === 'free' ? t('budget_free') : r.budgetType === 'max' ? t('budget_upto', { n: r.budgetMax }) : t('budget_flex'));
function exBody() {
  if (S.ex.tab === 'board') return boardHtml();
  const avail = ['any', 'now', 'today', 'weekend', 'evening'];
  return `<div class="stack"><div class="card flat stack"><div class="field"><label class="sr" for="ex-q">${t('search')}</label><div style="position:relative"><input id="ex-q" type="search" data-ex="q" value="${esc(S.ex.q)}" placeholder="${t('search_ph')}" style="padding-inline-start:44px"><span style="position:absolute;inset-inline-start:14px;top:13px;color:var(--muted)">${ic('search', 20)}</span></div></div>
    <div class="chips scroll" role="group" aria-label="${t('categories')}"><button class="chip ${S.ex.cat === 'all' ? 'on' : ''}" data-act="excat" data-v="all">${t('all')}</button>${C.CATEGORIES.map(c => `<button class="chip ${S.ex.cat === c.id ? 'on' : ''}" data-act="excat" data-v="${c.id}">${esc(c[S.lang])}</button>`).join('')}</div>
    <div class="row"><div class="field" style="min-width:200px;flex:1"><label for="ex-av" class="small">${t('availability')}</label><select id="ex-av" data-ex="avail">${avail.map(a => `<option value="${a}" ${S.ex.avail === a ? 'selected' : ''}>${t('av_' + a)}</option>`).join('')}</select></div>
      <label class="check" style="align-self:flex-end;min-height:46px;align-items:center"><input type="checkbox" data-ex="free" ${S.ex.free ? 'checked' : ''}><span>${t('free_only')}</span></label></div></div>
    <div id="ex-results">${exResults()}</div></div>`;
}
function viewExplore() {
  const hasHelper = !!(S.user.helper && S.user.helper.active); if (S.ex.tab === 'board' && !hasHelper) S.ex.tab = 'helpers';
  const tabs = hasHelper ? `<div class="tabs" role="tablist"><button class="tab ${S.ex.tab === 'helpers' ? 'on' : ''}" data-act="extab" data-v="helpers">${t('tab_helpers')}</button><button class="tab ${S.ex.tab === 'board' ? 'on' : ''}" data-act="extab" data-v="board">${t('tab_board')}</button></div>` : '';
  return shell('explore', `${pageHead(t('nav_explore'), t('explore_sub'))}${tabs}<div id="ex-body">${exBody()}</div>`);
}

/* helper profile */
function viewHelper(id) {
  let data; try { data = api.getHelper(id); } catch (e) { return shell('explore', empty('lock', t('not_available'), t('not_available_d'), `<a class="btn primary" href="#explore">${t('nav_explore')}</a>`)); }
  const h = data.helper; const reviews = data.reviews;
  return shell('explore', `<a class="small" href="#explore">${S.lang === 'ar' ? '→' : '←'} ${t('back_explore')}</a>
    <div class="card stack"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:16px">${avatar(h, 'lg')}<div class="grow stack-s"><h1 style="font-size:1.6rem">${esc(nm(h))}</h1>
      <div class="muted">${esc(uniName(h.universityId))} · ${esc(majorName(h.majorId, h.majorCustom))}</div>
      <div class="row">${verifiedPill(h)}${h.badges.includes('top_rated') ? pill(ic('star', 12, true) + t('badge_top_rated'), 'accent') : ''}${h.badges.includes('campus_helper') ? pill(ic('award', 12) + t('badge_campus_helper'), 'accent') : ''}${h.badges.includes('first_session') ? pill(t('badge_first_session')) : ''}${h.demo ? pill(t('demo_fictional'), 'sim') : ''}</div></div></div>
      <div class="row" style="gap:20px">${rating(h)}<span class="muted">${t('sessions_done', { n: h.completed })}</span><span>${priceHtml(h)}</span></div>
      <p>${esc(L(h.bio))}</p><hr class="divider">
      <div class="stack-s"><div class="lbl">${t('subjects')}</div><div class="chips">${h.subjects.map(s => `<span class="pill accent">${esc(catName(s))}</span>`).join('')}${h.topics.map(x => `<span class="tag">${esc(topicName(x))}</span>`).join('')}</div></div>
      ${h.skills.length ? `<div class="stack-s"><div class="lbl">${t('skills')}</div><div class="chips">${h.skills.map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div></div>` : ''}
      <div class="stack-s"><div class="lbl">${t('availability')}</div><div class="meta"><span>${ic('clock', 14)}${availText(h)}</span><span>${ic('mappin', 14)}${h.modes.map(m => t(m === 'online' ? 'online' : 'inperson')).join(' / ')}</span></div></div>
      <div class="banner info">${ic('book', 18)}<span>${t('peer_note')}</span></div>
      <div class="row">${data.isSelf ? `<a class="btn line" href="#profile">${t('edit_helper')}</a>` : `<button class="btn primary lg" data-act="reqhelper" data-id="${h.id}">${t('request_session')}</button><button class="btn line" data-act="report" data-type="user" data-id="${h.id}">${ic('flag', 16)}${t('report')}</button>`}</div></div>
    <div class="card"><h3 style="margin-bottom:10px">${t('reviews')} (${reviews.length})</h3>${reviews.length ? `<div class="list">${reviews.map(r => `<div class="li" style="align-items:flex-start"><div class="grow"><div class="row" style="gap:8px"><span class="stars">${ic('star', 14, true)}${r.rating}</span><b class="small">${esc(firstName({ names: r.by }))}</b><span class="tiny muted">${fmtD(r.at)}</span></div>${L(r.text) ? `<p class="small" style="margin-top:4px">${esc(L(r.text))}</p>` : ''}</div></div>`).join('')}</div>` : empty('star', t('no_reviews'), '')}</div>`);
}

/* request */
function reqDefaults() { return { text: '', subject: '', topic: '', preferredAt: '', mode: 'either', budgetType: 'flex', budgetMax: '30', extra: '', assistance: 'explain', urgency: 'low', skills: '', keywords: '' }; }
const nowLocal = () => { const d = new Date(Date.now() - new Date().getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };
function viewRequest() {
  if (S.req.phase === 'result') return viewRequestResult();
  const R = S.f.req = S.f.req || reqDefaults(); const A = S.analysis;
  let target = null; if (S.target) { try { target = api.getHelper(S.target).helper; } catch (e) { S.target = null; } }
  const topics = C.TOPICS.filter(x => !R.subject || x.cat === R.subject);
  return shell('request', `${pageHead(t('rq_title'), t('rq_sub'))}
    ${target ? `<div class="banner info">${avatar(target, 'sm')}<div class="grow"><b>${t('rq_target', { name: nm(target) })}</b><p class="small">${priceHtml(target).replace(/<[^>]+>/g, ' ')}</p></div><button class="btn sm line" data-act="cleartarget">${t('clear')}</button></div>` : ''}
    <form id="f-req" data-form="req" class="stack" novalidate><div id="req-err" role="alert"></div>
      <div class="card stack">
        <div class="field"><label for="q-text">${t('rq_text')}</label><textarea id="q-text" data-f="req.text" placeholder="${t('demo_text')}" aria-describedby="q-hint">${esc(R.text)}</textarea><p class="hint" id="q-hint">${t('rq_text_hint')}</p></div>
        <div class="row"><button type="button" class="btn soft" data-act="analyze" id="analyze-btn">${ic('sparkles', 18)}${t('analyze')}</button><span class="hint">${t('analyze_hint')}</span></div>
        ${A ? `<div class="card tint stack"><div class="row between"><h3 style="font-size:16px">${ic('sparkles', 16)} ${t('analysis_title')}</h3><span class="pill sim">${t(A.engine === 'llm' ? 'engine_llm' : 'engine_demo')}</span></div>
          <p class="small muted">${t('analysis_edit')}</p>
          ${A.moderation && A.moderation.flagged ? `<div class="banner bad">${ic('alert', 18)}<span>${t('mod_warn')}</span></div>` : ''}
          <div class="grid2"><div class="field"><label for="q-as">${t('assist_type')}</label><select id="q-as" data-f="req.assistance">${['explain', 'revision', 'feedback', 'practice', 'planning'].map(x => `<option value="${x}" ${R.assistance === x ? 'selected' : ''}>${t('as_' + x)}</option>`).join('')}</select></div>
          <div class="field"><label for="q-ur">${t('urgency')}</label><select id="q-ur" data-f="req.urgency">${['low', 'medium', 'high'].map(x => `<option value="${x}" ${R.urgency === x ? 'selected' : ''}>${t('urg_' + x)}</option>`).join('')}</select></div></div>
          <div class="grid2"><div class="field"><label for="q-sk">${t('req_skills')}</label><input id="q-sk" type="text" data-f="req.skills" value="${esc(R.skills)}"></div>
          <div class="field"><label for="q-kw">${t('req_keywords')}</label><input id="q-kw" type="text" data-f="req.keywords" value="${esc(R.keywords)}"></div></div></div>` : ''}
        <div class="grid2"><div class="field"><label for="q-sub">${t('subject')}</label><select id="q-sub" data-f="req.subject" data-rerender="1">${subjectOptions(R.subject, true)}</select></div>
          <div class="field"><label for="q-topic">${t('topic')}</label><input id="q-topic" type="text" list="topic-list" data-f="req.topic" value="${esc(R.topic)}"><datalist id="topic-list">${topics.map(x => `<option value="${esc(x[S.lang])}"></option>`).join('')}</datalist></div></div>
        <div class="grid2"><div class="field"><label for="q-when">${t('pref_time')}</label><input id="q-when" type="datetime-local" min="${nowLocal()}" data-f="req.preferredAt" value="${esc(R.preferredAt)}" dir="ltr"><p class="hint">${t('time_optional')}</p></div>
          <div class="field"><label for="q-mode">${t('mode_pref')}</label><select id="q-mode" data-f="req.mode">${['either', 'online', 'inperson'].map(x => `<option value="${x}" ${R.mode === x ? 'selected' : ''}>${t(x)}</option>`).join('')}</select></div></div>

      <button class="btn primary" type="submit">${t(u.helper ? 'save' : 'publish_helper')}</button></form></div>
    <div class="stack"><div class="card stack-s"><h3>${t('your_community')}</h3><p class="small muted">${t('community_d', { uni: uniName(u.universityId) })}</p></div>
      ${u.badges.length ? `<div class="card stack-s"><h3>${t('badges')}</h3><div class="chips">${u.badges.map(b => `<span class="pill accent">${t('badge_' + b)}</span>`).join('')}</div></div>` : ''}
      <div class="card stack-s"><button class="btn line" data-act="logout">${ic('logout', 18)}${t('logout')}</button>${u.demo ? `<hr class="divider"><p class="small muted">${t('reset_note')}</p><button class="btn danger sm" data-act="resetdemo">${t('reset_demo')}</button>` : ''}</div></div></div>`);
}

/* moderation */
function viewModeration() {
  let q; try { q = api.moderationQueue(); } catch (e) { return shell('moderation', empty('lock', t('not_available'), '')); }
  return shell('moderation', `${pageHead(t('nav_moderation'), t('mod_sub', { uni: uniName(S.user.universityId) }))}
    <div class="card"><h3 style="margin-bottom:10px">${t('mod_held')} (${q.requests.length})</h3>${q.requests.length ? q.requests.map(r => `<div class="hist" style="align-items:flex-start"><div class="grow stack-s"><div class="row"><b>${esc(firstName(r.requester))}</b>${r.flags.map(f => pill(t('flag_' + f), 'warn')).join('')}</div><p class="small">${esc(r.text)}</p></div><div class="row" style="flex-wrap:nowrap"><button class="btn sm primary" data-act="resolvereq" data-id="${r.id}" data-v="approve">${t('approve')}</button><button class="btn sm danger" data-act="resolvereq" data-id="${r.id}" data-v="reject">${t('reject')}</button></div></div>`).join('') : empty('check', t('mod_none'), '')}</div>
    <div class="card"><h3 style="margin-bottom:10px">${t('mod_reports')} (${q.reports.length})</h3>${q.reports.length ? q.reports.map(r => `<div class="hist" style="align-items:flex-start"><div class="grow stack-s"><div class="row">${pill(t('rr_' + r.reason), 'warn')}${pill(t('tt_' + r.targetType))}<span class="tiny muted">${ago(r.at)}</span></div>${r.note ? `<p class="small">${esc(r.note)}</p>` : ''}<span class="tiny muted">${t('reported_by', { name: firstName(r.reporter) })}</span></div><button class="btn sm line" data-act="resolvereport" data-id="${r.id}">${t('resolve')}</button></div>`).join('') : empty('check', t('mod_none'), '')}</div>`);
}

</script>
<script>
/* Fazaa UI, part 3: router, rendering and event handling */
const PROTECTED = ['dashboard', 'explore', 'request', 'sessions', 'rewards', 'profile', 'moderation', 'verify'];
const fixLinks = h => h.replace(/#helper-(u_[a-z0-9]+)/g, (m, id) => '#helper-' + id.replace('_', '-'));
const decodeHelperId = s => 'u_' + s.replace(/^u-/, '');
const splitList = s => String(s || '').split(/[,،\n]/).map(x => x.trim()).filter(Boolean);
let pendingScroll = null;

function route() {
  const raw = (location.hash || '#home').slice(1).split('?')[0] || 'home';
  return raw;
}
function go(h) { if (location.hash === h) render(false); else location.hash = h; }

function render(keep) {
  const y = window.scrollY; const r = route();
  S.user = api.me();
  const name = r.startsWith('helper-') ? 'helper' : r;
  if (PROTECTED.includes(name) || name === 'helper') { if (!S.user) { history.replaceState(null, '', '#login'); return render(false); } }
  if (S.user && (name === 'login' || name === 'register')) { history.replaceState(null, '', '#dashboard'); return render(false); }
  if (name === 'profile' && S.last !== 'profile') initProfileForms();
  if (name === 'moderation' && !(S.user && S.user.isModerator)) { history.replaceState(null, '', '#dashboard'); return render(false); }
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let html;
  try {
    switch (name) {
      case 'home': html = viewHome(); break;
      case 'login': html = viewLogin(); break;
      case 'register': html = viewRegister(); break;
      case 'verify': html = viewVerify(); break;
      case 'guidelines': html = viewGuidelines(); break;
      case 'dashboard': html = viewDashboard(); break;
      case 'explore': html = viewExplore(); break;
      case 'helper': html = viewHelper(decodeHelperId(r.slice(7))); break;
      case 'request': html = viewRequest(); break;
      case 'sessions': html = viewSessions(); break;
      case 'rewards': html = viewRewards(); break;
      case 'profile': html = viewProfile(); break;
      case 'moderation': html = viewModeration(); break;
      default: html = viewHome();
    }
  } catch (e) { console.error(e); html = `<div class="gut"><div class="authwrap">${empty('alert', t('err_generic'), '', `<a class="btn primary" href="#home">${t('nav_dashboard')}</a>`)}</div></div>`; }
  $('#root').innerHTML = fixLinks(html);
  document.title = 'Fazaa ' + (S.lang === 'ar' ? 'فزعة' : '');
  S.last = name;
  if (keep) window.scrollTo(0, y); else window.scrollTo(0, 0);
  if (pendingScroll) { const el = document.getElementById(pendingScroll); pendingScroll = null; if (el) el.scrollIntoView({ block: 'start' }); }
  if (name === 'register') checkEmailLive();
  if (S.chat) { const m = document.getElementById('msgs-' + S.chat); if (m) m.scrollTop = m.scrollHeight; }
}

/* feedback */
function showErr(id, e) {
  const box = document.getElementById(id); const msg = errText(e);
  if (box) box.innerHTML = `<div class="banner bad">${ic('alert', 18)}<span>${msg}</span></div>`;
  toast(msg, 'bad');
}
function handleErr(e) {
  if (e instanceof C.ApiError) { if (e.code === 'auth') { S.user = null; go('#login'); } toast(errText(e), 'bad'); }
  else { console.error(e); toast(t('err_generic'), 'bad'); }
}
const safe = fn => { try { return fn(); } catch (e) { handleErr(e); return undefined; } };

/* registration */
const REG_ERR = { name: 'name', uni_required: 'uni', email_invalid: 'email', email_mismatch: 'email', email_domain: 'email', email_taken: 'email', password_short: 'password', password_weak: 'password', gender_required: 'gender', major_required: 'major', interests_required: 'interests', agree_required: 'agree', referral_invalid: 'referral' };
function setFieldErr(field, text) {
  $$('[data-err]').forEach(el => { if (el.dataset.err === field) el.textContent = text || ''; });
  const map = { name: 'r-name', uni: 'r-uni', email: 'r-email', password: 'r-pw', major: 'r-major', referral: 'r-ref' };
  const inp = map[field] && document.getElementById(map[field]); if (inp) inp.setAttribute('aria-invalid', text ? 'true' : 'false');
}
function checkEmailLive() {
  const R = S.f.reg; if (!R || !R.email || !R.universityId) return;
  const email = String(R.email).trim(); if (!email.includes('@')) return;
  const uni = C.UNIVERSITIES.find(u => u.id === R.universityId);
  const v = C.validateUniEmail(R.universityId, email);
  if (v.ok) setFieldErr('email', ''); else setFieldErr('email', errText({ code: v.code, extra: { domains: uni.domains, other: v.other } }));
}
async function submitRegister() {
  const R = S.f.reg; ['name', 'uni', 'email', 'password', 'gender', 'major', 'interests', 'agree', 'referral'].forEach(f => setFieldErr(f, ''));
  const btn = $('#reg-btn'); btn.disabled = true;
  try {
    S.user = await api.register({ name: R.name, universityId: R.universityId, gender: R.gender, email: R.email, password: R.password, majorId: R.majorId, majorCustom: R.majorCustom, interests: R.interests, agree: !!R.agree, referralCode: R.referralCode });
    S.f.reg = null; toast(t('welcome_back'), 'good'); go('#verify');
  } catch (e) {
    btn.disabled = false;
    if (e instanceof C.ApiError && REG_ERR[e.code]) { const uni = C.UNIVERSITIES.find(u => u.id === R.universityId); setFieldErr(REG_ERR[e.code], errText({ code: e.code, extra: { domains: uni ? uni.domains : (e.extra || {}).domains, other: (e.extra || {}).other } })); const first = $('[aria-invalid="true"]') || $('.err:not(:empty)'); if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    else handleErr(e);
  }
}

/* requests */
function reqPayload() {
  const R = S.f.req;
  return { text: R.text, subject: R.subject, topic: R.topic, preferredAt: R.preferredAt, mode: R.mode, budgetType: R.budgetType, budgetMax: R.budgetMax, extra: R.extra,
    assistance: R.assistance, urgency: R.urgency, skills: splitList(R.skills), keywords: splitList(R.keywords) };
}
function doAnalyze() {
  const R = S.f.req; const btn = $('#analyze-btn'); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + t('analyze'); }
  setTimeout(() => safe(() => {
    const A = api.analyzeRequest({ text: R.text, hint: R.subject, lang: S.lang, preferredAt: R.preferredAt });
    S.analysis = A; if (!R.subject) R.subject = A.subject; R.topic = A.topic || R.topic; R.assistance = A.assistance; R.urgency = A.urgency; R.skills = A.skills.join(', '); R.keywords = A.keywords.join(', ');
    render(true);
    const el = $('.card.tint'); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }) || (btn && (btn.disabled = false)), 350);
}
function submitNewRequest(targetHelperId) {
  const btn = $('#req-btn'); if (btn) btn.disabled = true;
  try {
    const res = api.createRequest({ ...reqPayload(), targetHelperId: targetHelperId || undefined });
    S.req = { phase: 'result', result: res, matches: res.matches, sent: [], broadened: false };
    S.target = null; S.analysis = null; S.f.req = reqDefaults(); closeModal();
    toast(res.flagged ? t('held_title') : t('req_published'), res.flagged ? '' : 'good'); render(false);
  } catch (e) { if (btn) btn.disabled = false; closeModal(); if (e instanceof C.ApiError) showErr('req-err', e); else handleErr(e); }
}

/* modals */
function reportModal(type, id) {
  openModal(`<h3 style="margin-bottom:12px">${t('report_title')}</h3><div class="stack"><div class="field"><label for="rp-reason">${t('report_reason')}</label><select id="rp-reason">${['integrity', 'exam', 'spam', 'harassment', 'safety', 'other'].map(r => `<option value="${r}">${t('rr_' + r)}</option>`).join('')}</select></div>
    <div class="field"><label for="rp-note">${t('report_note')}</label><textarea id="rp-note" maxlength="500" style="min-height:90px"></textarea></div>
    <div class="row"><button class="btn primary grow" data-act="submitreport" data-type="${type}" data-id="${id}">${t('report')}</button><button class="btn line" data-act="closemodal">${t('cancel')}</button></div></div>`);
}
function reviewModal(id) {
  S.rv = { id, rating: 0 };
  openModal(`<h3 style="margin-bottom:12px">${t('review_title')}</h3><div class="stack"><div class="field"><span class="lbl">${t('rating_label')}</span><div class="rate" role="radiogroup" aria-label="${t('rating_label')}">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-act="star" data-v="${n}" role="radio" aria-checked="false" aria-label="${n}">${ic('star', 32, true)}</button>`).join('')}</div></div>
    <div class="field"><label for="rv-text">${t('review_text')} <span class="muted small" style="font-weight:400">(${t('optional')})</span></label><textarea id="rv-text" maxlength="500" style="min-height:90px"></textarea></div><div id="rv-err" role="alert"></div>
    <div class="row"><button class="btn primary grow" data-act="submitreview">${t('submit')}</button><button class="btn line" data-act="closemodal">${t('cancel')}</button></div></div>`);
}

/* click actions */
const ACTIONS = {
  lang() { S.lang = S.lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('fazaa.lang', S.lang); } catch (e) { /* ignore */ } if (S.analysis) S.analysis = null; render(true); },
  logout() { api.logout(); S.user = null; S.f = {}; S.analysis = null; S.chat = null; S.target = null; S.req = { phase: 'form', sent: [] }; go('#home'); },
  mode(el) { S.mode = el.dataset.v; render(true); },
  pw(el) { const inp = el.parentElement.querySelector('input'); const show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; el.innerHTML = ic(show ? 'eyeoff' : 'eye', 20); },
  async demo(el) {
    try { S.user = await api.login(el.dataset.email, api.demoPassword); S.demoOpen = false; toast(t('welcome_back'), 'good'); go('#dashboard'); } catch (e) { handleErr(e); }
  },
  resend() { safe(() => { api.resendCode(); toast(t('resend'), 'good'); render(true); }); },
  opensession(el, ev) {
    ev.preventDefault(); const s = api.listSessions().find(x => x.id === el.dataset.id);
    S.ses = { tab: s ? s.status : 'pending', role: 'all' }; S.chat = null; go('#sessions');
  },
  gohelper(el, ev) { ev.preventDefault(); pendingScroll = 'helper-sec'; S.last = ''; go('#profile'); },
  goboard(el, ev) { ev.preventDefault(); S.ex.tab = 'board'; go('#explore'); },
  chip(el) {
    const [form, key] = el.dataset.f.split('.'); const list = S.f[form][key]; const v = key === 'days' ? Number(el.dataset.v) : el.dataset.v;
    const i = list.indexOf(v); if (i >= 0) list.splice(i, 1); else list.push(v); render(true);
  },
  excat(el) { S.ex.cat = el.dataset.v; render(true); },
  extab(el) { S.ex.tab = el.dataset.v; render(true); },
  exreset() { S.ex = { ...S.ex, q: '', cat: 'all', avail: 'any', free: false }; render(true); },
  reqhelper(el) { S.target = el.dataset.id; S.req = { phase: 'form', sent: [] }; go('#request'); },
  cleartarget() { S.target = null; render(true); },
  analyze() { const R = S.f.req = S.f.req || reqDefaults(); if (String(R.text).trim().length < 12) { showErr('req-err', { code: 'text_short' }); return; } doAnalyze(); },
  pick(el) { safe(() => { const h = api.getHelper(el.dataset.id).helper; S.pay = { mode: 'session' }; payModal(h); }); },
  payconfirm(el) {
    if (S.pay && S.pay.mode === 'new') { submitNewRequest(el.dataset.id); return; }
    safe(() => {
      const res = S.req.result; const s = api.createSession({ requestId: res.request.id, helperId: el.dataset.id });
      S.req.sent.push(el.dataset.id); closeModal(); toast(t('sent_to', { name: nm(s.counterpart) }), 'good'); render(true);
    });
  },
  closemodal() { closeModal(); },
  editreq() { S.req = { phase: 'form', sent: [] }; render(false); },
  gorequests(el, ev) { ev.preventDefault(); S.ses.tab = 'requests'; go('#sessions'); },
  newreq() { S.req = { phase: 'form', sent: [] }; S.analysis = null; S.f.req = reqDefaults(); render(false); },
  broaden() { safe(() => { const r = api.getMatches(S.req.result.request.id, { broaden: true }); S.req.matches = r.matches; S.req.broadened = true; render(true); }); },
  findmatches(el) { safe(() => { const r = api.getMatches(el.dataset.id); S.req = { phase: 'result', result: { request: r.request, flagged: false, reasons: [], session: null }, matches: r.matches, sent: [], broadened: false }; go('#request'); }); },
  cancelreq(el) { safe(() => { api.cancelRequest(el.dataset.id); toast(t('cancelled_ok'), 'good'); render(true); }); },
  offer(el) { safe(() => { api.offerHelp(el.dataset.id); toast(t('offer_ok'), 'good'); render(true); }); },
  respond(el) { safe(() => { const yes = el.dataset.v === '1'; api.respondSession(el.dataset.id, yes); toast(t(yes ? 'accepted_ok' : 'declined_ok'), 'good'); if (yes) { S.ses.tab = 'accepted'; S.ses.role = 'all'; } render(true); }); },
  startses(el) { safe(() => { api.startSession(el.dataset.id); S.ses.tab = 'in_progress'; toast(t('session_started'), 'good'); render(true); }); },
  completeses(el) { safe(() => { api.completeSession(el.dataset.id); S.ses.tab = 'completed'; toast(t('session_done'), 'good'); render(true); }); },
  cancelses(el) { safe(() => { api.cancelSession(el.dataset.id); toast(t('cancelled_ok'), 'good'); render(true); }); },
  sestab(el) { S.ses.tab = el.dataset.v; render(true); },
  serole(el) { S.ses.role = el.dataset.v; render(true); },
  chat(el) { if (el.dataset.refresh) { render(true); return; } S.chat = S.chat === el.dataset.id ? null : el.dataset.id; render(true); },
  review(el) { reviewModal(el.dataset.id); },
  star(el) { const n = Number(el.dataset.v); S.rv.rating = n; $$('.rate button').forEach((b, i) => { b.classList.toggle('on', i < n); b.setAttribute('aria-checked', String(i + 1 === n)); }); },
  submitreview() {
    try { api.createReview(S.rv.id, S.rv.rating, $('#rv-text').value); closeModal(); toast(t('review_ok'), 'good'); render(true); } catch (e) { if (e instanceof C.ApiError) showErr('rv-err', e); else handleErr(e); }
  },
  report(el) { reportModal(el.dataset.type, el.dataset.id); },
  submitreport(el) { safe(() => { api.report({ targetType: el.dataset.type, targetId: el.dataset.id, reason: $('#rp-reason').value, note: $('#rp-note').value }); closeModal(); toast(t('report_ok'), 'good'); }); },
  redeem(el) { safe(() => { api.redeem(el.dataset.id); toast(t('redeem_ok'), 'good'); render(true); }); },
  copy(el) {
    const v = el.dataset.v; const done = () => toast(t('copied'), 'good');
    try { navigator.clipboard.writeText(v).then(done, () => { selectText($('#refcode')); done(); }); } catch (e) { selectText($('#refcode')); done(); }
  },
  helperactive(el) { safe(() => { api.setHelperActive(el.checked); toast(t('saved'), 'good'); render(true); }); },
  async resetdemo() { await C.reset(); S.user = null; S.f = {}; toast(t('reset_ok'), 'good'); go('#login'); },
  resolvereq(el) { safe(() => { api.resolveFlag('request', el.dataset.id, el.dataset.v); toast(t('approved_ok'), 'good'); render(true); }); },
  resolvereport(el) { safe(() => { api.resolveFlag('report', el.dataset.id, 'resolve'); toast(t('approved_ok'), 'good'); render(true); }); }
};
function selectText(el) { if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT' && el.dataset.act !== 'helperactive') return;
  const fn = ACTIONS[el.dataset.act]; if (fn) fn(el, ev);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });

/* inputs */
document.addEventListener('input', ev => {
  const el = ev.target; const d = el.dataset || {};
  if (d.ex) { S.ex[d.ex] = el.value; if (d.ex === 'q') { const box = $('#ex-results'); if (box) box.innerHTML = fixLinks(exResults()); } return; }
  if (d.f && el.type !== 'checkbox' && el.type !== 'radio' && el.tagName !== 'SELECT') { const [a, b] = d.f.split('.'); fset(a, b, el.value); if (a === 'reg' && b === 'email') checkEmailLive(); }
});
document.addEventListener('change', ev => {
  const el = ev.target; const d = el.dataset || {};
  if (d.ex) { S.ex[d.ex] = el.type === 'checkbox' ? el.checked : el.value; render(true); return; }
  if (!d.f) return; const [a, b] = d.f.split('.');
  fset(a, b, el.type === 'checkbox' ? el.checked : el.value);
  if (a === 'reg' && b === 'universityId') { const u = C.UNIVERSITIES.find(x => x.id === el.value); S.f.reg.gender = u && u.genders.length === 1 ? u.genders[0] : ''; render(true); return; }
  if (d.rerender) render(true);
  else if (a === 'reg' && b === 'email') checkEmailLive();
});

/* forms */
document.addEventListener('submit', async ev => {
  const form = ev.target.closest('form[data-form]'); if (!form) return; ev.preventDefault();
  const kind = form.dataset.form;
  if (kind === 'login') {
    const btn = $('#login-btn'); btn.disabled = true;
    try { S.user = await api.login(fget('login', 'email'), fget('login', 'password')); S.f.login = {}; toast(t('welcome_back'), 'good'); go('#dashboard'); }
    catch (e) { btn.disabled = false; if (e instanceof C.ApiError) showErr('login-err', e); else handleErr(e); }
  } else if (kind === 'reg') { await submitRegister(); }
  else if (kind === 'verify') {
    try { S.user = api.verifyEmail(fget('verify', 'code')); S.f.verify = {}; toast(t('verified_done'), 'good'); render(false); } catch (e) { if (e instanceof C.ApiError) showErr('verify-err', e); else handleErr(e); }
  } else if (kind === 'req') {
    const R = S.f.req = S.f.req || reqDefaults();
    if (!S.analysis) { if (String(R.text).trim().length < 12) { showErr('req-err', { code: 'text_short' }); return; } doAnalyze(); return; }
    if (!R.subject) { showErr('req-err', { code: 'subject_required' }); return; }
    if (S.target) { try { const h = api.getHelper(S.target).helper; S.pay = { mode: 'new' }; payModal(h); } catch (e) { handleErr(e); } } else submitNewRequest();
  } else if (kind === 'msg') {
    const inp = form.querySelector('input'); const id = form.dataset.id;
    safe(() => { api.sendMessage(id, inp.value); render(true); const n = document.getElementById('msg-' + id); if (n) n.focus(); });
  } else if (kind === 'pf') {
    try { api.updateProfile(S.f.pf); toast(t('saved'), 'good'); S.user = api.me(); render(true); } catch (e) { if (e instanceof C.ApiError) showErr('pf-err', e); else handleErr(e); }
  } else if (kind === 'hp') {
    const H = S.f.hp;
    try { api.saveHelperProfile({ ...H, days: H.days.map(Number), skills: splitList(H.skills) }); toast(t('helper_saved'), 'good'); S.user = api.me(); initProfileForms(); render(true); } catch (e) { if (e instanceof C.ApiError) showErr('hp-err', e); else handleErr(e); }
  }
});

window.addEventListener('hashchange', () => { closeModal(); render(false); });
(async function boot() {
  $('#root').innerHTML = '<div class="boot"><span class="spin"></span></div>';
  try { await C.init(); } catch (e) { console.error(e); }
  render(false);
})();

</script></body></html>
